name: "CI"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ADOBE_ID: ${{ secrets.ADOBE_ID }}
  PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.GATSBY_MAPBOX_ACCESS_TOKEN }}
  PUBLIC_UMAMI_SCRIPT_URL: ${{ secrets.GATSBY_UMAMI_SCRIPT_URL }}
  PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.GATSBY_UMAMI_WEBSITE_ID }}
  PUBLIC_INFURA_ID: ${{ secrets.GATSBY_INFURA_ID }}
  PUBLIC_WALLETCONNECT_ID: ${{ secrets.GATSBY_WALLETCONNECT_ID }}
  PUBLIC_WEB3_API_URL: ${{ secrets.PUBLIC_WEB3_API_URL }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - run: bun run prebuild
      - run: bun run typecheck

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - run: bun run test:unit
      - uses: qltysh/qlty-action/coverage@v1
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage/lcov.info

  test-e2e:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - run: bunx playwright install --with-deps
      - run: bun run test:e2e

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - name: Cache Astro build output
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.astro
          key: ubuntu-latest-astro-build-${{ hashFiles('content/**/*.jpg', 'content/**/*.png') }}
          restore-keys: ubuntu-latest-astro-build-
      - run: bun run build
      - name: Zip artifact for deployment
        if: github.ref == 'refs/heads/main'
        run: zip dist.zip ./dist -r
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: dist-ubuntu-latest
          path: dist.zip
          retention-days: 1

  deploy:
    needs: [lint, typecheck, test-unit, test-e2e, build]
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          name: dist-ubuntu-latest
      - name: Tune AWS CLI concurrency
        run: |
          # Fixed tuning for 2-core GitHub Actions runners (fast enough without thrash)
          CONC=32
          mkdir -p ~/.aws
          cat > ~/.aws/config <<EOF
          [default]
          s3 =
            max_concurrent_requests = $CONC
            max_queue_size = 10000
            multipart_threshold = 64MB
            multipart_chunksize = 16MB
          EOF
      - name: unzip artifact
        run: unzip dist.zip
      - name: Deploy to S3
        run: bun run deploy:s3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
